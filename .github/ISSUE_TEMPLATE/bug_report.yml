name: Bug report
description: Report something that's broken or not working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check `ROADMAP_HONEST.md` first — the behavior you're
        seeing might be a documented, known gap rather than an undiscovered bug.

  - type: input
    id: version
    attributes:
      label: PyTagManager version
      description: Output of `pip show pytagmanager` or the git commit you're on
      placeholder: "0.2.0, or commit sha"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.10 / 3.12 / ..."
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14, Ubuntu 22.04, ..."
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact `pytagmanager ...` command (or Python snippet) that triggered the bug
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error/traceback if there is one
      render: shell
    validations:
      required: true

  - type: textarea
    id: extras
    attributes:
      label: Was the `diagnostics` extra installed? Was Playwright's Chromium installed?
      placeholder: "pip install 'pytagmanager[diagnostics]' && playwright install chromium"
