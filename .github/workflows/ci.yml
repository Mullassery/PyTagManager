name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install Python build/test tooling
        run: python -m pip install --upgrade pip setuptools maturin pytest

      - name: Build and install the extension module (maturin develop)
        run: maturin develop

      - name: Install diagnostics extras (Tracking Observability tests need these)
        run: python -m pip install -e '.[diagnostics]'

      - name: Install Playwright's Chromium browser
        run: playwright install --with-deps chromium

      - name: Lint Python (ruff)
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 python

      - name: pytest tests/python
        run: pytest tests/python -v


  pytagshield-contract:
    # pytagshield 0.2.0 publishes only a macOS arm64 wheel; Linux has no sdist.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Build and install the extension module (maturin develop)
        run: |
          python -m pip install --upgrade pip setuptools maturin pytest
          maturin develop

      - name: Install audited PyTagShield contract version
        run: python -m pip install 'pytagshield==0.2.0'

      - name: Run PyTagShield contract tests
        run: pytest -q tests/python/test_ingest.py tests/python/test_control_pytagshield.py


  sdk:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Web SDK tests
        working-directory: sdk/web
        run: npm test

      - name: iOS library build
        run: swift build --package-path sdk/ios

      - name: iOS executable checks
        run: swift run --package-path sdk/ios PyTagManagerChecks

      - name: iOS XCTest
        run: swift test --package-path sdk/ios

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android build, lint and unit tests
        working-directory: sdk/android
        run: ./gradlew :sdk:build --no-daemon

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist-check
          maturin sdist --out dist-check

      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/pytagmanager-install
          /tmp/pytagmanager-install/bin/python -m pip install --upgrade pip
          /tmp/pytagmanager-install/bin/python -m pip install dist-check/*.whl

      - name: Smoke test installed CLI and CDN publication
        run: |
          /tmp/pytagmanager-install/bin/pytagmanager --help
          cd "$RUNNER_TEMP"
          printf '%s\n' \
            '{"exportFormatVersion":2,"containerVersion":{"tag":[],"trigger":[],"variable":[]}}' \
            > gtm-wheel-smoke.json
          /tmp/pytagmanager-install/bin/pytagmanager gtm inspect gtm-wheel-smoke.json \
            --format json > /dev/null
          /tmp/pytagmanager-install/bin/python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          import pytagmanager.cli
          assert "yaml" not in sys.modules
          assert "playwright" not in sys.modules

          from pytagmanager.control import ControlPlaneService, FileStore
          from pytagmanager.distribution import FilesystemCDN

          root = Path(tempfile.mkdtemp())
          service = ControlPlaneService(FileStore(root / "state"))
          service.create_container("GTM-WHEEL01")
          revision = service.create_revision("GTM-WHEEL01")
          service.create_environment("GTM-WHEEL01", "Production")
          service.activate_environment(
              "GTM-WHEEL01", "Production", config_version=revision.config_version
          )
          publisher = FilesystemCDN(root / "cdn")
          assert publisher.sdk_asset.is_file()
          result = publisher.publish_environment(service, "GTM-WHEEL01", "Production")
          assert (root / "cdn" / result.sdk_path).is_file()
          print("wheel installation smoke test passed")
          PY

      - name: Install source distribution into a clean environment
        run: |
          python -m venv /tmp/pytagmanager-sdist-install
          /tmp/pytagmanager-sdist-install/bin/python -m pip install --upgrade pip
          /tmp/pytagmanager-sdist-install/bin/python -m pip install dist-check/*.tar.gz
          /tmp/pytagmanager-sdist-install/bin/pytagmanager --help > /dev/null
          /tmp/pytagmanager-sdist-install/bin/python - <<'PY'
          import tempfile
          from pathlib import Path

          from pytagmanager.distribution import FilesystemCDN

          publisher = FilesystemCDN(Path(tempfile.mkdtemp()))
          assert publisher.sdk_asset.is_file()
          print("sdist installation smoke test passed")
          PY

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (Rust dependency vulnerabilities)
        run: cargo audit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit and this project's declared dependencies
        run: |
          python -m pip install --upgrade pip setuptools pip-audit
          python -m pip install 'click>=8.0' 'playwright>=1.40' 'pyyaml>=6.0' \
            'google-api-python-client>=2.100' 'google-auth>=2.23' \
            'google-auth-oauthlib>=1.1'

      - name: pip-audit (Python dependency vulnerabilities)
        run: pip-audit --strict
