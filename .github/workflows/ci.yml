name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install Python build/test tooling
        run: python -m pip install --upgrade pip setuptools maturin pytest

      - name: Build and install the extension module (maturin develop)
        run: maturin develop

      - name: Install diagnostics extras (Tracking Observability tests need these)
        run: python -m pip install -e '.[diagnostics]'

      - name: Install Playwright's Chromium browser
        run: playwright install --with-deps chromium

      - name: Lint Python (ruff)
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 python

      - name: pytest tests/python
        run: pytest tests/python -v


  sdk:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Web SDK tests
        working-directory: sdk/web
        run: npm test

      - name: iOS library build
        run: swift build --package-path sdk/ios

      - name: iOS executable checks
        run: swift run --package-path sdk/ios PyTagManagerChecks

      - name: iOS XCTest
        run: swift test --package-path sdk/ios

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android build, lint and unit tests
        working-directory: sdk/android
        run: ./gradlew :sdk:build --no-daemon

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (Rust dependency vulnerabilities)
        run: cargo audit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit and this project's declared dependencies
        run: |
          python -m pip install --upgrade pip setuptools pip-audit
          python -m pip install 'click>=8.0' 'playwright>=1.40' 'pyyaml>=6.0' \
            'google-api-python-client>=2.100' 'google-auth>=2.23' \
            'google-auth-oauthlib>=1.1'

      - name: pip-audit (Python dependency vulnerabilities)
        run: pip-audit --strict
