[package]
name = "pytagmanager"
version = "0.1.0"
edition = "2021"
description = "Rust core (crawler + semantic DOM graph engine) for PyTagManager"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.20"
roxmltree = "0.20"
url = "2"
futures = "0.3"

[profile.release]
lto = true
