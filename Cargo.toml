[package]
name = "pytagmanager"
version = "0.3.1"
edition = "2021"
description = "Rust core (crawler + semantic DOM graph engine) for PyTagManager"
license = "Apache-2.0"

[lib]
name = "_core"
# "rlib" is added alongside "cdylib" so `cargo test`'s integration tests
# (tests/*.rs) can link against and directly exercise the crawler/dom
# modules (e.g. orchestrator::crawl against a local mock server) without
# going through the PyO3/Python boundary. maturin only uses the cdylib
# artifact, so this is additive and does not change the built wheel.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.27"
roxmltree = "0.21"
url = "2"
futures = "0.3"
mudfish-core = { git = "https://github.com/Mullassery/MudFish", rev = "71176fa" }
mudfish-frontier = { git = "https://github.com/Mullassery/MudFish", rev = "71176fa" }
mudfish-fetch = { git = "https://github.com/Mullassery/MudFish", rev = "71176fa" }
mudfish-parser = { git = "https://github.com/Mullassery/MudFish", rev = "71176fa" }
mudfish-browser = { git = "https://github.com/Mullassery/MudFish", rev = "71176fa" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

[profile.release]
lto = true
