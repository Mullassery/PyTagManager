# Same-domain front door for PyTagManager SDK/config/collection paths.
# Replace example.com and certificate paths before enabling.

map $http_origin $pytagmanager_cors_origin {
    default "";
    "https://www.example.com" "https://www.example.com";
}

server {
    listen 443 ssl http2;
    server_name www.example.com;
    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;

    # Immutable SDK assets and revision configs.
    location /tagmanager/ {
        alias /srv/pytagmanager-cdn/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Collection endpoint: no caching, no request-body logging.
    location = /collect {
        proxy_pass http://127.0.0.1:8080/collect;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 64k;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin $pytagmanager_cors_origin always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # Never expose PyTagShield admin/control routes to the public internet.
    location /shield/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8090/;
    }
}
