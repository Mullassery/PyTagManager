[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pytagmanager"
version = "0.6.0"
description = "Debugging and implementation intelligence for Google Tag Manager: inspect containers, diagnose runtime tracking, audit consent and script performance, and generate reviewable fixes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["click>=8.0"]

[project.scripts]
pytagmanager = "pytagmanager.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
diagnostics = [
    "playwright>=1.40",
    "pyyaml>=6.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Broad exception handling is deliberate in best-effort diagnostics/adapters;
# these rules are reviewed case-by-case rather than mechanically enforced.
ignore = ["E501", "BLE001", "TRY004", "S110"]

[tool.coverage.run]
source = ["python/pytagmanager"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.maturin]
python-source = "python"
module-name = "pytagmanager._core"
features = ["pyo3/extension-module"]
include = ["LICENSE"]
