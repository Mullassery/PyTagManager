[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "pytagmanager"
version = "0.1.2"
description = "AI-native analytics implementation platform (v1: crawl -> semantic DOM graph -> rule-based tracking recommendations -> GTM export)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary License — Free to use with explicit attribution"}
dependencies = ["click>=8.0"]

[project.scripts]
pytagmanager = "pytagmanager.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.maturin]
python-source = "python"
module-name = "pytagmanager._core"
features = ["pyo3/extension-module"]
