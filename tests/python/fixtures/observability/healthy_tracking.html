<!doctype html>
<html>
<head><title>Healthy Tracking Fixture</title></head>
<body>
<button data-testid="add-to-cart">Add to Cart</button>
<script>
  window.dataLayer = window.dataLayer || [];
  document.querySelector('[data-testid="add-to-cart"]').addEventListener('click', function () {
    dataLayer.push({
      event: 'add_to_cart',
      value: 19.99,
      currency: 'USD',
      items: [{ item_id: 'sku123', item_name: 'Widget', price: 19.99, quantity: 1 }],
    });
    fetch('https://www.google-analytics.com/g/collect?v=2&en=add_to_cart&tid=G-TEST123&ep.value=19.99&ep.currency=USD');
  });
</script>
</body>
</html>
