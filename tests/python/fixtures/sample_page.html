<!doctype html>
<html>
  <head><title>Sample Product Page</title></head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/contact" aria-label="Contact us">Contact</a>
    </nav>
    <main>
      <section id="hero">
        <h1>Widget Pro</h1>
        <button data-testid="add-to-cart">Add to Cart</button>
        <button class="btn-buy-now">Buy Now</button>
      </section>
      <section>
        <a href="/whitepaper.pdf" class="download-link">Download Whitepaper</a>
      </section>
      <form id="newsletter-form">
        <input type="email" name="email" />
        <button type="submit">Subscribe</button>
      </form>
      <div class="unrelated-widget">
        <span>Just some text, not a tracked interaction.</span>
      </div>
    </main>
  </body>
</html>
